[build]
  publish = "."

# Canonical domain redirects — must come before path-based rules
[[redirects]]
  from = "https://reliable-conkies-700067.netlify.app/*"
  to = "https://syntropyearth.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.syntropyearth.com/*"
  to = "https://syntropyearth.com/:splat"
  status = 301
  force = true

# Clean URLs: serve /services/index.html at /services
[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301

# Guide standards pages: Netlify serves /guide/frameworks/sasb.html at the
# extensionless /guide/frameworks/sasb with a 200, so Google indexed four of
# these twice and split the ranking signals between the pair. The canonical tag,
# the sitemap and all 60 internal links already point at the .html form, so these
# 301s make the extensionless variant resolve to it instead of duplicating it.
# Added 27 July 2026 after Search Console confirmed the split.

[[redirects]]
  from = "/guide/frameworks/brsr"
  to = "/guide/frameworks/brsr.html"
  status = 301

[[redirects]]
  from = "/guide/frameworks/brsr/"
  to = "/guide/frameworks/brsr.html"
  status = 301

[[redirects]]
