[build]
  publish = "."

# Canonical domain redirects — must come before path-based rules
[[redirects]]
  from = "https://reliable-conkies-700067.netlify.app/*"
  to = "https://syntropyearth.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.syntropyearth.com/*"
  to = "https://syntropyearth.com/:splat"
  status = 301
  force = true

# Old services page -> Social Impact. Moved here from _redirects so every
# redirect lives in one file. The force flag beats /services/index.html on disk.
[[redirects]]
  from = "/services/*"
  to = "/social-impact/"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/social-impact/"
  status = 301
  force = true

